<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BN Stream Web</title>
<meta name="description" content="BN Stream in the browser: movies, series, free live TV and classic films">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
